  <g fill="none" stroke="#ffffff" stroke-width="3.1" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8.2 12.6 L11.4 22.4 L16 14.6 L20.6 22.4 L23.8 12.6"/>
  </g>
</svg>
