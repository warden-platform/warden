apiVersion: apps/v1
kind: Deployment
metadata:
  name: pam-connector
  namespace: pam-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pam-connector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pam-connector
    spec:
      serviceAccountName: pam-connector-bootstrap
      automountServiceAccountToken: false
      containers:
        - name: connector
          image: registry.example.com/pam/pam-connector:0.1.0
          imagePullPolicy: Always
          env:
            - name: PAM_KUBERNETES_ENABLED
              value: "true"
            - name: PAM_CONTROL_URL
              value: "http://pam-control.pam-system.svc:8080"
            - name: PAM_CONNECTOR_NAME
              value: "kubernetes-pam-demo"
            - name: PAM_CONNECTOR_ENVIRONMENT
              value: "testing"
            - name: PAM_ALLOWED_NAMESPACES
              value: "pam-demo"
            - name: PAM_ALLOWED_IMAGE_PREFIXES
              value: "registry.example.com/demo/"
            - name: PAM_EXECUTION_SERVICE_ACCOUNT
              value: "pam-executor"
            - name: PAM_KUBERNETES_TOKEN_AUDIENCE
              value: "https://kubernetes.default.svc"
            - name: PAM_TASK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: pam-task-signing
                  key: key
          volumeMounts:
            - name: bootstrap-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: bootstrap-token
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken:
                  path: token
                  audience: "https://kubernetes.default.svc"
                  expirationSeconds: 600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
