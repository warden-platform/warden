apiVersion: v1
kind: ServiceAccount
metadata:
  name: pam-connector-bootstrap
  namespace: pam-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pam-executor
  namespace: pam-demo
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pam-token-issuer
  namespace: pam-demo
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["pam-executor"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pam-connector-token-issuer
  namespace: pam-demo
subjects:
  - kind: ServiceAccount
    name: pam-connector-bootstrap
    namespace: pam-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pam-token-issuer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pam-executor
  namespace: pam-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pam-executor
  namespace: pam-demo
subjects:
  - kind: ServiceAccount
    name: pam-executor
    namespace: pam-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pam-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pam-resource-discoverer
  namespace: pam-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pam-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pam-cluster-reader-discoverer
subjects:
  - kind: ServiceAccount
    name: pam-connector-bootstrap
    namespace: pam-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pam-cluster-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pam-cluster-reader-executor
subjects:
  - kind: ServiceAccount
    name: pam-executor
    namespace: pam-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pam-cluster-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pam-resource-discoverer
  namespace: pam-demo
subjects:
  - kind: ServiceAccount
    name: pam-connector-bootstrap
    namespace: pam-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pam-resource-discoverer
