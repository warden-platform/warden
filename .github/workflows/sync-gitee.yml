name: Sync Gitee mirror

# GitHub master 是主仓库与合并门禁；Gitee 是国内镜像。本 workflow 同步：
#   - master 分支：每次 master 前进后快进推送；
#   - tag：GitHub Release 发布后推送对应 tag（Gitee 已存在则跳过，不比对历史 tag）；
#   - Gitee 发行版：GitHub Release 发布后自动创建，正文与 GitHub Release 一致。
# 不搬 GitHub Release 附件；只做普通 push（绝不 force），保护分支拦截会自动建 PR。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   GITEE_USERNAME  Gitee 账号
#   GITEE_TOKEN     Gitee 私人令牌（作为 HTTPS 密码与 API token）
# 未配置时本 workflow 打印 warning 并跳过，不阻塞 master 的 CI。
#
# 仅上游仓库执行；fork 没有 Gitee 同步需求与 Secrets，job 会跳过。
on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要补同步的版本 tag（留空则同步最新 GitHub Release）'
        required: false

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  master:
    if: >-
      github.repository == 'warden-platform/warden' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须完整历史：浅克隆下 git 无法证明远端 master 是本地 HEAD 的祖先，
          # 会把正常的 fast-forward 误判为 non-fast-forward 而拒绝推送。
          fetch-depth: 0
          fetch-tags: true
      - name: Push master and tags to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_USERNAME:-}" ] || [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 GITEE_USERNAME / GITEE_TOKEN，跳过 Gitee 自动同步"
            exit 0
          fi

          target_sha="$(git rev-parse HEAD)"
          gitee_url="https://gitee.com/warden-platform/warden.git"
          auth="$(printf '%s:%s' "$GITEE_USERNAME" "$GITEE_TOKEN" | base64 -w0)"
          echo "GitHub HEAD: $target_sha"

          # 凭据放 extraHeader，避免出现在 remote URL / 日志里。
          git_auth=(-c "http.extraHeader=Authorization: Basic $auth")

          if ! push_out="$(git "${git_auth[@]}" push "$gitee_url" HEAD:refs/heads/master 2>&1)"; then
            printf '%s\n' "$push_out" >&2
            echo "推送到 Gitee 失败：检查凭据、分支保护或历史分叉（本流程绝不 force push）" >&2
            exit 1
          fi
          printf '%s\n' "$push_out"

          remote_sha="$(git "${git_auth[@]}" ls-remote "$gitee_url" refs/heads/master | awk '{print $1}' | head -1)"
          if [ "$remote_sha" != "$target_sha" ]; then
            echo "Gitee master 未前进（当前 ${remote_sha:-unknown}）" >&2
            pr_url="$(printf '%s\n' "$push_out" | grep -oE 'https://gitee\.com/[^ ]+/pulls/[0-9]+' | head -1 || true)"
            if [ -n "$pr_url" ]; then
              echo "Gitee 保护分支拦截了直推并创建了同步 PR，请合并后重跑本 workflow：$pr_url" >&2
            fi
            exit 1
          fi
          echo "Gitee master 已同步到 ${target_sha:0:7}"

  release:
    needs: master
    if: >-
      always() &&
      github.repository == 'warden-platform/warden' &&
      (github.event_name == 'release' || github.event_name == 'workflow_dispatch') &&
      (needs.master.result == 'success' || needs.master.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      - name: Push tag and create Gitee release
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${GITEE_USERNAME:-}" ] || [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 GITEE_USERNAME / GITEE_TOKEN，跳过 Gitee 发行版同步"
            exit 0
          fi

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')"
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "无效版本 tag: $tag" >&2; exit 2 ;;
          esac

          if ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag"
          fi
          target_sha="$(git rev-list -n1 "$tag")"
          echo "同步 $tag ($target_sha)"

          gitee_url="https://gitee.com/warden-platform/warden.git"
          auth="$(printf '%s:%s' "$GITEE_USERNAME" "$GITEE_TOKEN" | base64 -w0)"
          git_auth=(-c "http.extraHeader=Authorization: Basic $auth")

          # GitHub 与 Gitee 的历史 tag 可能指向不同提交（GitHub 为快照历史），
          # 已存在的 tag 一律跳过，不重复推送、也不做历史比对；只补缺失 tag。
          remote_obj="$(git "${git_auth[@]}" ls-remote "$gitee_url" "refs/tags/$tag" | awk '{print $1}' | head -1)"
          if [ -z "$remote_obj" ]; then
            if ! tag_out="$(git "${git_auth[@]}" push "$gitee_url" "refs/tags/$tag" 2>&1)"; then
              printf '%s\n' "$tag_out" >&2
              echo "推送 tag $tag 到 Gitee 失败（不 force）" >&2
              exit 1
            fi
            printf '%s\n' "$tag_out"
          else
            echo "Gitee tag $tag 已存在，跳过推送"
          fi

          api="https://gitee.com/api/v5/repos/warden-platform/warden"
          # Gitee 对不存在的发行版返回 200 + null，必须按响应体判断。
          existing_id="$(curl -sS -H "Authorization: token $GITEE_TOKEN" "$api/releases/tags/$tag" | jq -r '.id // empty')"
          if [ -n "$existing_id" ]; then
            echo "Gitee 发行版 $tag 已存在（id=$existing_id），跳过"
            exit 0
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,isPrerelease > "$RUNNER_TEMP/gh-release.json"
          jq --arg target "$target_sha" \
            '{tag_name: .tagName, name: .name, body: .body, target_commitish: $target, prerelease: .isPrerelease}' \
            "$RUNNER_TEMP/gh-release.json" > "$RUNNER_TEMP/gitee-release.json"

          curl -fsS -X POST \
            -H "Authorization: token $GITEE_TOKEN" \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/gitee-release.json" \
            "$api/releases" > "$RUNNER_TEMP/gitee-release-response.json"
          jq -r '"Gitee 发行版已创建: \(.tag_name) \(.html_url // "")"' \
            "$RUNNER_TEMP/gitee-release-response.json"
