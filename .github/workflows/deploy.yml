name: Deploy

# 生产部署：在自托管 runner（部署机）上把指定版本切上去。
#   - 「Publish images」成功且由 tag 触发时自动进入，版本取该 tag；
#   - 也可手动 workflow_dispatch 指定版本（用于回滚或重发）。
# warden-deploy 会先从 warden-deploy 脚本镜像（内部制品，不进入服务镜像）自更新，
# 再做数据库备份、应用新增迁移，然后切换镜像、探活与同步前端。
#
# 仅上游仓库执行；fork 没有自托管 runner 与 production 环境，不会触发。
#
# 前置（部署机一次性配置，见 CONTRIBUTING「发版」）：
#   1. 装好 GitHub Actions self-hosted runner（标签 self-hosted, Linux, X64）；
#   2. 仓库 Settings → Environments 建 production 并要求人工审批；
#   3. 部署机安装 root:root 的 /usr/local/bin/warden-deploy
#      （内容即仓库 scripts/deploy-compose.sh），并配置
#      /etc/sudoers.d/warden-deploy 仅对该命令免密：
#        runner ALL=(root) NOPASSWD: /usr/local/bin/warden-deploy
#      引导版本安装一次后，后续脚本更新随新版本控制面镜像自动完成。
#   4. /etc/warden/deploy.env 固化本机部署目录/前端目录。
#
# job 不做 checkout：脚本以 root 安装在宿主机，runner 工作区不参与部署。
on:
  workflow_run:
    workflows: ['Publish images']
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: '要部署的版本 tag（如 v0.4.3），可用于回滚'
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'warden-platform/warden' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: [self-hosted, Linux]
    environment: production
    timeout-minutes: 60
    steps:
      - name: Resolve version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$RUN_TAG}"
          case "$version" in
            v[0-9]*) ;;
            *) echo "无效版本（须以 v 开头）: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy on host
        run: |
          set -euo pipefail
          sudo -n /usr/local/bin/warden-deploy "${{ steps.v.outputs.version }}"
