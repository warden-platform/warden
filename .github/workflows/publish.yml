name: Publish images

# 发版镜像：push tag（v*）或手动触发，构建控制面 / 管理端 / operator / connector
# 四个镜像并推送到阿里云 ACR，随后为该 tag 创建 GitHub Release（正文取
# CHANGELOG.md 对应版本小节）。发布正式环境只需打一个新 tag，然后把部署清单
# （compose / Helm）里的 image 版本改成该 tag。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   ACR_USERNAME  ACR 登录用户名（含命名空间权限）
#   ACR_PASSWORD  ACR 登录密码
#
# 与 scripts/publish-acr.sh 行为对齐：推 version + latest 双 tag；
# ACR 个人版不支持 BuildKit 默认 attestation，故 provenance/sbom 必须关闭。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本 tag（如 v0.4.3）'
        required: true

permissions:
  contents: write

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: warden-stable

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          TAG_REF: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$TAG_REF}"
          case "$version" in
            v[0-9]*) ;;
            *) echo "版本必须以 v 开头（如 v0.4.3），实际：$version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  server-images:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: warden-control
            repo: warden
          - target: warden-operator
            repo: warden-operator
          - target: warden-connector
            repo: warden-connector
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            TARGET=${{ matrix.target }}
            GO_IMAGE=golang:1.26-alpine
            RUNTIME_IMAGE=gcr.io/distroless/static-debian12:nonroot
            GOPROXY=https://proxy.golang.org,direct
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.repo }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.repo }}:latest
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.repo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repo }}

  web-image:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NODE_IMAGE=node:22-alpine
            NGINX_IMAGE=nginxinc/nginx-unprivileged:1.27-alpine
            NPM_REGISTRY=https://registry.npmjs.org
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/warden-web:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/warden-web:latest
          provenance: false
          sbom: false
          cache-from: type=gha,scope=warden-web
          cache-to: type=gha,mode=max,scope=warden-web

  github-release:
    needs: [prepare, server-images, web-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tag 触发时 checkout 该 tag；手动触发时按输入的版本 tag checkout。
          ref: ${{ github.event.inputs.version || github.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，跳过。"
            exit 0
          fi

          notes="$(mktemp)"
          awk -v heading="## [${VERSION#v}]" '
            index($0, heading) == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"
          sed -i '/./,$!d' "$notes"

          if ! grep -q '[^[:space:]]' "$notes"; then
            printf '版本 %s：变更见 CHANGELOG.md。\n' "$VERSION" > "$notes"
          fi

          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Warden $VERSION" \
            --notes-file "$notes"
