version: "1.0"
name: probe-tools
displayName: 工具探针
stages:
- name: probe
  displayName: 探针
  strategy: naturally
  trigger: auto
  steps:
  - step: custom-build@custom
    name: probe
    displayName: 工具探针
    commands: |
      ls /mnt/pipeline-tools/standard/golang
      ls /mnt/pipeline-tools/standard/node
      find /mnt/pipeline-tools/standard/golang -maxdepth 3 -name go -type f 2>/dev/null
      find /mnt/pipeline-tools/standard/node -maxdepth 3 -name node -type f 2>/dev/null
    notify: []
    strategy:
      retry: "0"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true