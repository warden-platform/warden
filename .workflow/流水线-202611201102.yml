version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 镜像发布（ACR）
stages:
- name: 构建并推送
  displayName: 构建并推送
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: build_control
    displayName: 控制面 warden
    certificate: a1d7fac0-c6d5-013f-dc83-4a6d49cc916c
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: huanght
    password: "{{CERTIFICATION.a770f100-c6d4-013f-6b4f-521bcfbadef6.password}}"
    tag: "warden:${VERSION}"
    dockerfile: ./server/Dockerfile
    isCache: true
    parameter:
      TARGET: warden-control
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_web
    displayName: 管理端 warden-web
    certificate: a1d7fac0-c6d5-013f-dc83-4a6d49cc916c
    repository: "{{CERTIFICATION.a1d7fac0-c6d5-013f-dc83-4a6d49cc916c.server}}"
    username: "{{CERTIFICATION.a1d7fac0-c6d5-013f-dc83-4a6d49cc916c.username}}"
    password: "{{CERTIFICATION.a1d7fac0-c6d5-013f-dc83-4a6d49cc916c.password}}"
    tag: "warden-web:${VERSION}"
    dockerfile: ./web/Dockerfile
    context: ./web
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_operator
    displayName: warden-operator
    certificate: a770f100-c6d4-013f-6b4f-521bcfbadef6
    repository: "{{CERTIFICATION.a770f100-c6d4-013f-6b4f-521bcfbadef6.server}}"
    username: "{{CERTIFICATION.a770f100-c6d4-013f-6b4f-521bcfbadef6.username}}"
    password: "{{CERTIFICATION.a770f100-c6d4-013f-6b4f-521bcfbadef6.password}}"
    tag: "warden-operator:${VERSION}"
    dockerfile: ./server/Dockerfile
    isCache: true
    parameter:
      TARGET: warden-operator
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_connector
    displayName: warden-connector
    certificate: a770f100-c6d4-013f-6b4f-521bcfbadef6
    repository: "{{CERTIFICATION.a770f100-c6d4-013f-6b4f-521bcfbadef6.server}}"
    username: "{{CERTIFICATION.a770f100-c6d4-013f-6b4f-521bcfbadef6.username}}"
    password: "{{CERTIFICATION.a770f100-c6d4-013f-6b4f-521bcfbadef6.password}}"
    tag: "warden-connector:${VERSION}"
    dockerfile: ./server/Dockerfile
    isCache: true
    parameter:
      TARGET: warden-connector
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
variables:
  VERSION:
    type: TEXT
    default: v0.4.0
