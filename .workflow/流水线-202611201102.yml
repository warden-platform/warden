version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 镜像发布（ACR）
# 发版镜像流水线：手动触发，VERSION 填要发布的版本（与 git tag 一致）。
# 四个镜像推送到 registry.cn-hangzhou.aliyuncs.com/warden-stable：
#   warden（控制面）/ warden-web / warden-operator / warden-connector
# 凭据：Gitee Go「通用变量」（仓库级流水线无凭证管理入口）：
#   ACR_USERNAME / ACR_PASSWORD / acr_warden_stable（仓库地址含命名空间，
#   变量名不支持中划线故用下划线）。值存 Gitee Go 设置端，不进仓库。
# 实测：buildArgs 不支持（变体 Dockerfile 解决 TARGET）；context 有效；
# 变量未定义时解析为空导致首跑失败。
# 红线：凭据绝不写进本文件（公开仓库）。
# 兜底：scripts/publish-acr.sh 在 ECS 上可完成同样的发布。
variables:
  VERSION: v0.4.0
stages:
- name: publish
  displayName: 构建并推送
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: build_control
    displayName: 控制面 warden
    repository: ${acr_warden_stable}
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden:${VERSION}
    dockerfile: ./server/Dockerfile
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_web
    displayName: 管理端 warden-web
    repository: ${acr_warden_stable}
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-web:${VERSION}
    dockerfile: ./web/Dockerfile
    context: ./web
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_operator
    displayName: warden-operator
    repository: ${acr_warden_stable}
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-operator:${VERSION}
    dockerfile: ./server/Dockerfile.operator
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_connector
    displayName: warden-connector
    repository: ${acr_warden_stable}
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-connector:${VERSION}
    dockerfile: ./server/Dockerfile.connector
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true