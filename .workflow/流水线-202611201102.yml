version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 镜像发布（ACR）
# 发版镜像流水线：手动触发，VERSION 填要发布的版本（与 git tag 一致）。
# 四个镜像推送到 registry.cn-hangzhou.aliyuncs.com/warden-stable：
#   warden（控制面）/ warden-web / warden-operator / warden-connector
# 凭据：type: account 模式。实测通用变量可覆盖 YAML 声明变量的空默认值
# （ACR_PASSWORD 真实值存通用变量，不进仓库）；插件字段直接引用未声明
# 变量则不解析。username 使用非敏感默认值 huanght。
# 实测插件 schema（plugin scheme 命令）：type 默认 cert（凭证模式，
# 仓库级无凭证库故必须 type: account）；构建参数字段名是 parameter
# （KeyMap），不是 buildArgs；context 有效。
# 红线：凭据绝不写进本文件（公开仓库）。
# 兜底：scripts/publish-acr.sh 在 ECS 上可完成同样的发布。
variables:
  VERSION: v0.4.0
  # 空默认值仅为声明参数（非敏感）；真实密码触发时传入：
  # CLI: gitee pipeline run ... -p ACR_PASSWORD=<密码>；或 UI 触发时填写。
  ACR_PASSWORD: ""
  ACR_USERNAME: huanght
stages:
- name: publish
  displayName: 构建并推送
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: build_control
    displayName: 控制面 warden
    type: account
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden:${VERSION}
    dockerfile: ./server/Dockerfile
    parameter:
      TARGET: warden-control
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_web
    displayName: 管理端 warden-web
    type: account
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-web:${VERSION}
    dockerfile: ./web/Dockerfile
    context: ./web
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_operator
    displayName: warden-operator
    type: account
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-operator:${VERSION}
    dockerfile: ./server/Dockerfile
    parameter:
      TARGET: warden-operator
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_connector
    displayName: warden-connector
    type: account
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-connector:${VERSION}
    dockerfile: ./server/Dockerfile
    parameter:
      TARGET: warden-connector
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true