version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 镜像发布（ACR）
# 发版镜像流水线：手动触发，VERSION 填要发布的版本（与 git tag 一致）。
# 四个镜像推送到 registry.cn-hangzhou.aliyuncs.com/warden-stable：
#   warden（控制面）/ warden-web / warden-operator / warden-connector
# 凭据：流水线变量 ACR_USERNAME / ACR_PASSWORD（文本类型，在流水线
# 「参数设置/添加变量」中配置，值存 Gitee Go 设置端，不进仓库）。
# 红线：凭据绝不写进本文件（公开仓库）。
# 兜底：scripts/publish-acr.sh 在 ECS 上可完成同样的发布。
variables:
  VERSION: v0.4.0
stages:
- name: publish
  displayName: 构建并推送
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: build_control
    displayName: 控制面 warden
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden:${VERSION}
    dockerfile: ./server/Dockerfile
    buildArgs:
      TARGET: warden-control
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_web
    displayName: 管理端 warden-web
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-web:${VERSION}
    dockerfile: ./web/Dockerfile
    context: ./web
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_operator
    displayName: warden-operator
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-operator:${VERSION}
    dockerfile: ./server/Dockerfile
    buildArgs:
      TARGET: warden-operator
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_connector
    displayName: warden-connector
    repository: registry.cn-hangzhou.aliyuncs.com/warden-stable
    username: ${ACR_USERNAME}
    password: ${ACR_PASSWORD}
    tag: warden-connector:${VERSION}
    dockerfile: ./server/Dockerfile
    buildArgs:
      TARGET: warden-connector
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true