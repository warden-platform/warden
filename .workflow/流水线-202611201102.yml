version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 镜像发布（ACR）
# 发版镜像流水线：手动触发，VERSION 填要发布的版本（与 git tag 一致）。
# 四个镜像推送到 registry.cn-hangzhou.aliyuncs.com/warden-stable：
#   warden（控制面）/ warden-web / warden-operator / warden-connector
# 凭据：Gitee Go「凭证管理」中的镜像仓库凭证 acr-warden-stable
#（server 须含命名空间：registry.cn-hangzhou.aliyuncs.com/warden-stable，
# 插件按 server/tag 拼镜像全名；用户名/密码为 ACR 访问凭据）。
# 实测：社区 image-build 插件只认 certificate，repository/username/
# password/buildArgs 字段均被忽略；context 字段有效。
# 红线：凭据绝不写进本文件（公开仓库）。
# 兜底：scripts/publish-acr.sh 在 ECS 上可完成同样的发布。
variables:
  VERSION: v0.4.0
stages:
- name: publish
  displayName: 构建并推送
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: build_control
    displayName: 控制面 warden
    certificate: acr-warden-stable
    tag: warden:${VERSION}
    dockerfile: ./server/Dockerfile
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_web
    displayName: 管理端 warden-web
    certificate: acr-warden-stable
    tag: warden-web:${VERSION}
    dockerfile: ./web/Dockerfile
    context: ./web
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_operator
    displayName: warden-operator
    certificate: acr-warden-stable
    tag: warden-operator:${VERSION}
    dockerfile: ./server/Dockerfile.operator
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_connector
    displayName: warden-connector
    certificate: acr-warden-stable
    tag: warden-connector:${VERSION}
    dockerfile: ./server/Dockerfile.connector
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true