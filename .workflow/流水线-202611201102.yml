version: "1.0"
name: 测试、构建、上传、发布、部署到自有主机
displayName: 镜像发布（ACR）
# 发版镜像流水线：手动触发，VERSION 填要发布的版本（与 git tag 一致）。
# 四个镜像推送到 registry.cn-hangzhou.aliyuncs.com/warden-stable：
#   warden（控制面）/ warden-web / warden-operator / warden-connector
#
# 凭据：cert 模式，certificate 引用账号级「凭证管理」的凭证 ali-docker
# （个人设置 → 流水线 Gitee go → 凭证管理；Docker 仓库账号密码类型，
# server 含命名空间 warden-stable）。username/password/server 由服务端
# 按凭证模板解析，本文件不写任何字面凭据（公开仓库安全）。
#
# 实测插件 schema（gitee pipeline plugin scheme）：构建参数字段名是
# parameter（KeyMap），不是 buildArgs；context 字段有效；type 默认 cert。
# 兜底：scripts/publish-acr.sh 在 ECS 上可完成同样的发布。
variables:
  VERSION: v0.4.1
stages:
- name: publish
  displayName: 构建并推送
  strategy: naturally
  trigger: auto
  steps:
  - step: build@docker
    name: build_control
    displayName: 控制面 warden
    certificate: a1d7fac0-c6d5-013f-dc83-4a6d49cc916c
    tag: warden:${VERSION}
    dockerfile: ./server/Dockerfile
    parameter:
      TARGET: warden-control
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_web
    displayName: 管理端 warden-web
    certificate: a1d7fac0-c6d5-013f-dc83-4a6d49cc916c
    tag: warden-web:${VERSION}
    dockerfile: ./web/Dockerfile
    context: ./web
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_operator
    displayName: warden-operator
    certificate: a1d7fac0-c6d5-013f-dc83-4a6d49cc916c
    tag: warden-operator:${VERSION}
    dockerfile: ./server/Dockerfile
    parameter:
      TARGET: warden-operator
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
  - step: build@docker
    name: build_connector
    displayName: warden-connector
    certificate: a1d7fac0-c6d5-013f-dc83-4a6d49cc916c
    tag: warden-connector:${VERSION}
    dockerfile: ./server/Dockerfile
    parameter:
      TARGET: warden-connector
    isCache: true
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true