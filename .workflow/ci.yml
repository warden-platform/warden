version: "1.0"
name: ci-gate
displayName: CI 门禁（测试/构建）
# Gitee master 合入门禁（方案甲）：push/PR 触发，拦截编译/单测/lint 回归。
# 服务端跑非 DB 门控测试（无 WARDEN_TEST_DATABASE_URL 时 DB 集成测试自动 Skip）；
# 完整 DB 门控集成测试由 GitHub CI（postgres service）兜底。
# 真正阻断合入须在 Gitee 仓库设置开启保护分支 master + PR 必过本流水线。
stages:
- name: server
  displayName: 服务端门禁
  strategy: naturally
  trigger: auto
  steps:
  - step: custom-build@custom
    name: server-gate
    displayName: Go vet/build/单测
    commands: |
      source setup golang
      cd server
      go vet ./...
      go build ./...
      go test ./...
    notify: []
    strategy:
      retry: "0"
- name: web
  displayName: 前端门禁
  strategy: naturally
  trigger: auto
  steps:
  - step: custom-build@custom
    name: web-gate
    displayName: 前端 lint/单测/构建
    commands: |
      source setup node
      cd web
      npm ci
      npm run lint
      npm run test
      npm run build
    notify: []
    strategy:
      retry: "0"
triggers:
  push:
    branches:
      precise: [master]
  pr:
    branches:
      precise: [master]
notify: []
strategy:
  blocking: true