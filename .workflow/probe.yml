version: "1.0"
name: probe-env
displayName: 环境探针（临时）
stages:
- name: probe
  displayName: 探针
  strategy: naturally
  trigger: auto
  steps:
  - step: custom-build@custom
    name: probe
    displayName: 环境探针
    commands:
    - set +x
    - find /mnt /usr/local /opt -name 'buildctl*' -type f 2>/dev/null | head -3
    - echo pw-len=$(printf '%s' '${ACR_PASSWORD}' | wc -c)
    - nproc
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "4"
        memory: "8"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true